<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Uplift — Content That Matters</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 2L14.4 9.2L22 12L14.4 14.8L12 22L9.6 14.8L2 12L9.6 9.2Z"/>
        </svg>
      </div>
      <div class="splash-name">Uplift</div>
      <div class="splash-loader"><div class="splash-loader-bar"></div></div>
    </div>
  </div>

  <!-- Onboarding (shown if not logged in) -->
  <div id="onboarding" class="onboarding" style="display:none;"></div>

  <!-- App Shell (shown if logged in) -->
  <div id="app" style="display:none;">

    <!-- Pages -->
    <div id="page-feed" class="page active"></div>
    <div id="page-discover" class="page"></div>
    <div id="page-create" class="page"></div>
    <div id="page-live" class="page"></div>
    <div id="page-profile" class="page"></div>
    <div id="page-settings" class="page"></div>

    <!-- Comment Bottom Sheet -->
    <div id="comment-backdrop" class="comment-backdrop"></div>
    <div id="comment-sheet" class="comment-sheet">
      <div class="comment-sheet-handle"></div>
      <div class="comment-sheet-header">
        <span class="comment-sheet-count"></span>
        <button class="comment-sheet-close" aria-label="Close comments">&times;</button>
      </div>
      <div class="comment-sheet-list" id="comment-list"></div>
      <div class="comment-sheet-input">
        <div class="comment-avatar-small" id="comment-user-avatar"></div>
        <input type="text" placeholder="Add a comment..." id="comment-input">
        <button class="comment-send" id="comment-send">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Double-tap heart animation -->
    <div id="heart-burst" class="heart-burst">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="#FF2D55"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-page="feed">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" data-page="discover">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <span>Discover</span>
      </button>
      <button class="nav-item nav-create" data-page="create">
        <div class="nav-create-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </button>
      <button class="nav-item" data-page="live">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Live</span>
      </button>
      <button class="nav-item" data-page="profile">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Me</span>
      </button>
    </nav>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
